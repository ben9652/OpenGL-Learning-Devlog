# Configuración del sitio. Ajustar si el repo cambia de nombre.
title_es: "Ruta OpenGL desde cero"
title_en: "OpenGL path from scratch"
description: "Devlog de mi aprendizaje de OpenGL: cada parte con su video y su texto completo en español e inglés."

url: "https://ben9652.github.io"
# Debe coincidir EXACTAMENTE con el nombre del repositorio (respeta mayúsculas).
baseurl: "/OpenGL-Learning-Devlog"

collections:
  devlog:
    output: true
    permalink: /devlog/:name/

defaults:
  - scope:
      path: ""
      type: "devlog"
    values:
      layout: "post"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
