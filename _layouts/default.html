<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.part %}Parte {{ page.part }} — {{ page.title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">inicio</a>
        <a href="{{ site.github_url }}">github</a>
      </nav>
    </div>
  </header>

  <main class="inner">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p>Texto completo en español e inglés · <a href="{{ site.github_url }}">código y devlog</a></p>
    </div>
  </footer>

  <script>
    (function () {
      var es = document.getElementById('lang-es');
      var en = document.getElementById('lang-en');
      if (!es || !en) return;

      function apply() {
        document.body.classList.toggle('show-en', en.checked);
      }

      try {
        if (localStorage.getItem('devlog-lang') === 'en') en.checked = true;
      } catch (e) {}

      es.addEventListener('change', function () {
        try { localStorage.setItem('devlog-lang', 'es'); } catch (e) {}
        apply();
      });

      en.addEventListener('change', function () {
        try { localStorage.setItem('devlog-lang', 'en'); } catch (e) {}
        apply();
      });

      apply();
    })();
  </script>
</body>
</html>
